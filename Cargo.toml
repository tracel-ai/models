[workspace]
resolver = "3"
members = [
    "albert-burn",
    "bert-burn",
    "minilm-burn",
    "mobilenetv2-burn",
    "resnet-burn",
    "resnet-burn/examples/inference",
    "resnet-burn/examples/finetune",
    "squeezenet-burn",
    "yolox-burn",
]

[workspace.package]
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
# burn ecosystem
burn        = { git = "https://github.com/tracel-ai/burn", rev = "5bd017038495063afea85aa200fb94d6969028c3", default-features = false }
burn-store  = { git = "https://github.com/tracel-ai/burn", rev = "5bd017038495063afea85aa200fb94d6969028c3", default-features = false }
burn-onnx   = { version = "0.22.0-pre.3" }

# shared third-party
serde       = { version = "1", default-features = false }
serde_json  = "1"
tokio       = "1"
libm        = "0.2"
itertools   = { version = "0.15", default-features = false }
dirs        = "6"
# 1.0 is an API rewrite (new client builder, owner/name split, `blocking` feature) and
# pulls in the xet stack; upgrading it means rewriting the download path in three crates.
hf-hub      = "0.5"
image       = { version = "0.25", default-features = false }
clap        = { version = "4", features = ["derive"] }
tokenizers  = { version = "0.23", default-features = false }
rand        = { version = "0.10", default-features = false }
tar         = "0.4"
csv         = "1"
flate2      = "1"
derive-new  = "0.7"
criterion   = "0.8"
divan       = "0.1"
